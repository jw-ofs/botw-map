<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breath of the Wild — Interactive Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css" />
<link rel="stylesheet" href="vendor/leaflet/MarkerCluster.Default.css" />
<style>
  :root{
    --bg:#0d1418; --panel:#121b21; --panel2:#1b2730; --line:#27333d;
    --text:#e0ebf2; --muted:#88a0b1; --accent:#e8943c; --cyan:#5ad1e6; --good:#6fc24f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  #app{display:flex;height:100%}

  #sidebar{width:332px;min-width:332px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;transition:margin-left .25s}
  #app.sb-collapsed #sidebar{margin-left:-332px}
  .brand{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#16242c,transparent)}
  .brand h1{margin:0;font-size:17px;letter-spacing:1.5px;color:var(--cyan);font-weight:700}
  .brand h1 span{color:var(--accent)}
  .brand p{margin:3px 0 0;font-size:11px;color:var(--muted);letter-spacing:.4px}
  .dash{padding:10px 18px 12px;border-bottom:1px solid var(--line)}
  .dash-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
  .dash-top b{color:var(--good)}
  .dash-bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .dash-bar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--good));width:0;transition:width .35s}
  .dash-sub{font-size:10.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .tools{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .search-wrap{position:relative}
  .search{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px}
  .search input::placeholder{color:var(--muted)}
  .results{display:none;margin-top:4px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;max-height:280px;overflow-y:auto;position:absolute;left:0;right:0;z-index:20}
  .results::-webkit-scrollbar{width:7px}.results::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .res{display:flex;align-items:center;gap:9px;padding:7px 9px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:none}
  .res:hover{background:var(--panel)}
  .res-ic{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .res-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res-cat{font-size:10px;color:var(--muted);flex-shrink:0}
  .res-empty{padding:9px;font-size:12px;color:var(--muted)}
  .row{display:flex;gap:8px}
  .btn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:7px;font-size:11.5px;cursor:pointer;transition:.15s;text-align:center}
  .btn:hover{border-color:var(--cyan);color:var(--text)}
  .btn.active{background:var(--cyan);color:#06222a;border-color:var(--cyan);font-weight:600}
  .cats{flex:1;overflow-y:auto;padding:8px 8px 24px}
  .cats::-webkit-scrollbar{width:8px}
  .cats::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .group-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:10px 8px 5px}
  .cat{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;cursor:pointer;user-select:none}
  .cat:hover{background:var(--panel2)}
  .cat.off{opacity:.38}
  .cat .ic{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .cat .nm{flex:1;font-size:13px}
  .cat .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .cat .ct b{color:var(--good)}

  #map{flex:1;height:100%;background:#06121b;cursor:grab}
  #map:active{cursor:grabbing}
  .leaflet-container{background:#06121b}
  #togglebar{position:absolute;top:12px;left:344px;z-index:1000;display:flex;gap:8px;transition:left .25s}
  #app.sb-collapsed #togglebar{left:12px}
  .iconbtn{background:rgba(18,27,33,.92);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{border-color:var(--cyan)}

  .pin{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #08141b;box-shadow:0 1px 4px rgba(0,0,0,.6);font-size:13px;transition:transform .1s}
  .pin:hover{transform:scale(1.25);z-index:9999}
  .pin.done{filter:grayscale(1) brightness(.7);opacity:.65}
  .region-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:#d6e6ef;font-size:12px;font-weight:600;letter-spacing:.8px;text-shadow:0 1px 3px #000,0 0 7px #000,0 0 7px #000;pointer-events:none;opacity:var(--rl-op,.9);transition:opacity .25s}

  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border-radius:10px;border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
  .leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5}
  .pop-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--cyan);margin-bottom:3px}
  .pop-t{font-size:15px;font-weight:600;margin-bottom:6px}
  .pop-d{color:var(--muted);margin-bottom:9px;line-height:1.45}
  .pop-actions{display:flex;gap:8px;align-items:stretch}
  .pop-found{display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;flex:1}
  .pop-found.on{border-color:var(--good);color:var(--good)}
  .pop-wiki{display:flex;align-items:center;font-size:11.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:0 11px;white-space:nowrap}
  .pop-wiki:hover{border-color:var(--cyan);color:var(--cyan)}
  .leaflet-popup-close-button{color:var(--muted)!important}

  #coord{position:absolute;bottom:10px;right:10px;z-index:1000;background:rgba(18,27,33,.9);border:1px solid var(--line);color:var(--muted);font-size:11px;padding:5px 9px;border-radius:6px;font-variant-numeric:tabular-nums;pointer-events:none}
  .marker-cluster{background:rgba(90,209,230,.22)}
  .marker-cluster div{background:rgba(90,209,230,.82);color:#06222a;font-weight:700;font-family:inherit}

  /* Routes / questlines */
  .qpin{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #08141b;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  .qpin span{transform:rotate(45deg);color:#06222a;font-size:11px;font-weight:700}
  .qpin.start{box-shadow:0 0 0 3px rgba(232,148,60,.45),0 1px 6px rgba(0,0,0,.7);z-index:9999}
  .qpin.done{filter:grayscale(.6) brightness(.8);opacity:.6}
  .qpin.current{box-shadow:0 0 0 3px rgba(90,209,230,.6),0 0 11px rgba(90,209,230,.55);z-index:9000}
  .quest-row .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
  .quest-row.off{opacity:.45}
  #questPanel{position:absolute;top:12px;right:12px;width:300px;max-height:calc(100% - 24px);z-index:1100;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:none;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.55)}
  #questPanel.open{display:flex}
  .qp-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .qp-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .qp-dot{width:12px;height:12px;border-radius:50%}
  .qp-x{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 7px;border-radius:5px}
  .qp-x:hover{color:var(--text);background:var(--panel2)}
  .qp-prog{padding:10px 14px;border-bottom:1px solid var(--line)}
  .qp-prog-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
  .qp-prog-top b{color:var(--good)}
  .qp-steps{overflow-y:auto;padding:6px}
  .qp-steps::-webkit-scrollbar{width:7px}.qp-steps::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .qs-row{display:flex;align-items:flex-start;gap:9px;padding:8px;border-radius:7px;cursor:pointer}
  .qs-row:hover{background:var(--panel2)}
  .qs-row.cur{background:rgba(90,209,230,.1);box-shadow:inset 0 0 0 1px rgba(90,209,230,.4)}
  .qs-row.done .qs-t{text-decoration:line-through;color:var(--muted)}
  .qs-chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--good);margin-top:1px}
  .qs-chk.on{border-color:var(--good);background:rgba(111,194,79,.18)}
  .qs-num{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#06222a;margin-top:1px}
  .qs-body{flex:1;min-width:0}
  .qs-t{font-size:12.5px;line-height:1.35}

  /* Region completion accordion */
  .regions{border-bottom:1px solid var(--line)}
  .reg-h{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);user-select:none}
  .reg-h:hover{color:var(--text)}
  .reg-h .chev{transition:transform .2s}
  .reg-h.open .chev{transform:rotate(90deg)}
  .reg-list{display:none;padding:2px 14px 10px;max-height:230px;overflow-y:auto}
  .reg-list.open{display:block}
  .reg-list::-webkit-scrollbar{width:7px}.reg-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .reg-row{padding:5px 5px;cursor:pointer;border-radius:6px}
  .reg-row:hover{background:var(--panel2)}
  .reg-top{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px}
  .reg-top b{color:var(--good);font-variant-numeric:tabular-nums}
  .reg-bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .reg-bar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--good));transition:width .35s}

  /* Korok ground/flight subfilter */
  .ksub{display:flex;flex-wrap:wrap;gap:6px;padding:0 9px 8px 43px}
  .kpill{font-size:10.5px;padding:3px 10px;border-radius:11px;border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
  .kpill.on{background:var(--good);color:#06220a;border-color:var(--good);font-weight:600}

  /* Rich popup bits */
  .pop-img{width:100%;max-height:135px;object-fit:cover;border-radius:7px;margin-bottom:8px;background:var(--panel2);display:block}
  .pop-type{font-size:11px;color:var(--muted);margin-bottom:8px}
  .pop-region{font-size:10.5px;color:var(--cyan);margin-left:6px}
  .leaflet-tooltip{background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:11px;box-shadow:0 1px 6px rgba(0,0,0,.5)}
  .leaflet-tooltip-top:before{border-top-color:var(--line)}
  .leaflet-tooltip-bottom:before{border-bottom-color:var(--line)}

  /* Enemy combat chips */
  .pop-stat{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:0 0 5px}
  .pop-weak{color:#b9f0b0;border-color:#2f5a32;background:#172a18}
  .pop-weak b{color:#d7ffce}
  .pop-deals{color:#eaa99e;border-color:#5a302b;background:#2a1a17}
  .pop-deals b{color:#ffb4a6}
  .pop-sum{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.45}
  /* Per-marker notes */
  .pop-note{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--text);font:inherit;font-size:12px;padding:6px 8px;margin:2px 0 0;resize:vertical;min-height:34px}
  .pop-note:focus{outline:none;border-color:var(--cyan)}
  .pin{position:relative}
  .note-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--cyan);border:1.5px solid #08141b}
  /* Toast + undo */
  #toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);z-index:1500;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px;display:flex;gap:13px;align-items:center;font-size:12.5px;box-shadow:0 6px 22px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  #toast .undo{cursor:pointer;color:var(--cyan);font-weight:600}
  #toast .undo:hover{text-decoration:underline}

  @media(max-width:640px){
    #sidebar{position:absolute;z-index:1100;height:100%}
    #togglebar{left:auto;right:10px;z-index:1200}
    #app.sb-collapsed #togglebar{left:10px;right:auto}
    #coord{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>BREATH OF THE <span>WILD</span></h1>
      <p>Interactive Map · Hyrule</p>
    </div>
    <div class="dash">
      <div class="dash-top"><span>Completion</span><span><b id="dashPct">0%</b></span></div>
      <div class="dash-bar"><div id="dashFill"></div></div>
      <div class="dash-sub" id="dashSub">0 / 0 found</div>
    </div>
    <div id="regionsBox" class="regions"></div>
    <div class="tools">
      <div class="search-wrap">
        <div class="search">
          <span style="color:var(--muted);margin-right:7px">🔍</span>
          <input id="search" placeholder="Search shrines, towers, locations…" autocomplete="off">
        </div>
        <div id="results" class="results"></div>
      </div>
      <div class="row">
        <div class="btn" id="allOn">Show all</div>
        <div class="btn" id="allOff">Hide all</div>
        <div class="btn" id="hideFound">Hide found</div>
      </div>
      <div class="row">
        <div class="btn" id="exportBtn">Export</div>
        <div class="btn" id="importBtn">Import</div>
        <div class="btn" id="shareBtn">Share view</div>
        <div class="btn" id="reset">Reset</div>
      </div>
      <div class="row">
        <div class="btn" id="markVis">✓ Mark visible</div>
        <div class="btn" id="clearVis">Clear visible</div>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
    <div class="cats" id="cats"></div>
  </aside>

  <div id="map"></div>
  <div id="togglebar">
    <button class="iconbtn" id="sbToggle" title="Toggle sidebar">☰</button>
  </div>
  <div id="coord">px: 0, py: 0</div>
  <div id="questPanel"></div>
  <div id="toast"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/leaflet/leaflet.markercluster.js"></script>
<script src="markers.js"></script>
<script src="quests.js"></script>
<script src="bossdata.js"></script>
<script>
/* ============================================================
   Base map = datamined BotW Hyrule tiles (24000x20000), served
   locally from ./tiles. Markers carry pixel (px,py) coordinates
   that map exactly onto the tiles: px = 2*worldX + 12000,
   py = 2*worldZ + 10000  (1 game unit = 2 px, origin = center).
   ============================================================ */
const CONFIG = { tileUrl:"tiles/{z}/{x}/{y}.webp", tileSize:256, nativeZoom:7, imgW:24000, imgH:20000 };
const NZ = CONFIG.nativeZoom, SCALE = Math.pow(2, NZ);   // 128
const xy = (px, py) => L.latLng(-py / SCALE, px / SCALE);
const fromLatLng = ll => [ Math.round(ll.lng * SCALE), Math.round(-ll.lat * SCALE) ];
const bounds = L.latLngBounds(xy(0, CONFIG.imgH), xy(CONFIG.imgW, 0));

const map = L.map("map", {
  crs: L.CRS.Simple,
  minZoom: 1,
  maxZoom: NZ + 2,          // allow 2 levels of upscale for korok precision
  zoomControl: false,
  attributionControl: false,
  maxBounds: bounds.pad(0.25),
  maxBoundsViscosity: 0.7,
  zoomSnap: 0.25,
  zoomDelta: 0.5,
});
L.control.zoom({ position:"bottomleft" }).addTo(map);
L.tileLayer(CONFIG.tileUrl, {
  tileSize: CONFIG.tileSize, minNativeZoom: 0, maxNativeZoom: NZ,
  noWrap: true, bounds: bounds,
  updateWhenZooming: false, updateWhenIdle: true, keepBuffer: 3,
}).addTo(map);
map.fitBounds(bounds);

/* ---- Progress (localStorage) ---- */
const SAVE_KEY = "botw-map-found-v1";
let found = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
const saveFound = () => localStorage.setItem(SAVE_KEY, JSON.stringify(found));
const NOTES_KEY = "botw-map-notes-v1";
let notes = JSON.parse(localStorage.getItem(NOTES_KEY) || "{}");
const saveNotes = () => localStorage.setItem(NOTES_KEY, JSON.stringify(notes));

/* ---- State ---- */
const catState = {};
const markerRefs = [];
const catById = {};
let hideFound = false;
CATEGORIES.forEach(c => catById[c.id] = c);

const PREFS_KEY = "botw-map-prefs";
const SAVED_PREFS = (function(){ try{ return JSON.parse(localStorage.getItem(PREFS_KEY) || "null"); }catch(e){ return null; } })();
function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify({ cats:catState, hf:hideFound })); }catch(e){} }

/* ---- Build category list ---- */
const catsEl = document.getElementById("cats");
const groups = {};
CATEGORIES.forEach(c => { (groups[c.group] ||= []).push(c); });

function pinHtml(cat, isDone, noted){
  return `<div class="pin ${isDone?'done':''}" style="background:${cat.color};width:24px;height:24px">${cat.icon}${noted?'<i class="note-dot"></i>':''}</div>`;
}
function divIcon(cat, isDone, noted){
  return L.divIcon({ html: pinHtml(cat, isDone, noted), className:"", iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-14] });
}
function iconFor(d, cat){ return divIcon(cat, !!found[d.id], !!notes[d.id]); }
function regionIcon(name){
  return L.divIcon({ html:`<div class="region-label">${name}</div>`, className:"", iconSize:[0,0], iconAnchor:[0,0] });
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function wikiUrl(name){ return "https://zelda.fandom.com/wiki/" + encodeURIComponent(name.replace(/ /g,"_")); }
const NO_WIKI = new Set(["korok","region"]);
const KT_LABEL = { ground:"🌿 Ground korok", fly:"🍃 Flight korok" };
const CT_LABEL = { rupee:"💜 Rupees", gem:"💎 Gem / material", arrow:"🏹 Arrows", gear:"⚔️ Weapon / armor", other:"✦ Special" };
function bossHtml(d){
  const b = window.BOSSDATA && BOSSDATA[d.name];
  if(!b) return "";
  let h = "";
  if(b.weak && b.weak.length) h += `<div class="pop-stat pop-weak"><b>Weak</b> ${b.weak.map(esc).join(" · ")}</div>`;
  if(b.deals && b.deals.length) h += `<div class="pop-stat pop-deals"><b>Deals</b> ${b.deals.map(esc).join(" · ")}</div>`;
  if(b.tip) h += `<div class="pop-sum">🛡 ${esc(b.tip)}</div>`;
  return h;
}

function popupHtml(d, cat){
  const on = !!found[d.id];
  const wiki = NO_WIKI.has(cat.id) ? "" :
    `<a class="pop-wiki" href="${wikiUrl(d.name)}" target="_blank" rel="noopener">Wiki ↗</a>`;
  const img = d.img ? `<img class="pop-img" src="${esc(d.img)}" loading="lazy" onerror="this.remove()">` : "";
  const tl = d.kt ? KT_LABEL[d.kt] : (d.ct ? CT_LABEL[d.ct] : "");
  const type = tl ? `<div class="pop-type">${tl}</div>` : "";
  const region = d.region ? `<span class="pop-region">◈ ${esc(d.region)}</span>` : "";
  return `
    ${img}
    <div class="pop-cat">${cat.icon} ${esc(cat.name)}${region}</div>
    <div class="pop-t">${esc(d.name)}</div>
    ${type}
    ${d.desc ? `<div class="pop-d">${esc(d.desc)}</div>` : ""}
    ${bossHtml(d)}
    <div class="pop-actions">
      <div class="pop-found ${on?'on':''}" data-id="${d.id}"><span>${on?'✓':'○'}</span><span>${on?'Found':'Mark as found'}</span></div>
      <div class="pop-wiki pop-copy" data-copy="${d.id}" title="Copy link to this marker">🔗</div>
      ${wiki}
    </div>
    <textarea class="pop-note" data-note="${d.id}" placeholder="Add a note…">${esc(notes[d.id]||"")}</textarea>`;
}
function bindPopup(d, cat, m){
  const el = document.querySelector(`.pop-found[data-id="${d.id}"]`);
  if(el) el.onclick = () => {
    if(found[d.id]) delete found[d.id]; else found[d.id]=1;
    saveFound();
    const ref = markerRefs.find(r=>r.data.id===d.id);
    ref.marker.setIcon(iconFor(d, cat));
    m.setPopupContent(popupHtml(d,cat));
    bindPopup(d,cat,m);
    refreshCounts();
    if(hideFound) rebuildCluster();
  };
  const cp = document.querySelector(`.pop-copy[data-copy="${d.id}"]`);
  if(cp) cp.onclick = () => copyMarkerLink(d, cp);
  const nt = document.querySelector(`.pop-note[data-note="${d.id}"]`);
  if(nt) nt.onchange = nt.onblur = () => {
    const v = nt.value.trim();
    if(v) notes[d.id] = v; else delete notes[d.id];
    saveNotes();
    const ref = markerRefs.find(r=>r.data.id===d.id);
    if(ref) ref.marker.setIcon(iconFor(d, cat));
  };
}
async function copyMarkerLink(d, btn){
  location.hash = "m=" + encodeURIComponent(d.id);
  try{ await navigator.clipboard.writeText(location.href); if(btn){ btn.textContent="✓"; setTimeout(()=>btn.textContent="🔗",1200); } }catch(e){}
}
function makeMarker(d){
  const cat = catById[d.cat];
  const isRegion = d.cat === "region";
  const m = isRegion
    ? L.marker(xy(d.px, d.py), { icon: regionIcon(d.name), interactive:false, keyboard:false })
    : L.marker(xy(d.px, d.py), { icon: iconFor(d, cat), title: d.name });
  if(!isRegion){
    m.bindPopup(() => popupHtml(d, cat), { closeButton:true, minWidth: 230 });
    m.on("popupopen", () => bindPopup(d, cat, m));
    if(d.cat !== "korok") m.bindTooltip(d.name, { direction:"top", offset:[0,-12], opacity:.95 });
  }
  const ref = { marker:m, data:d, cat, isRegion };
  markerRefs.push(ref);
  return ref;
}

const cluster = L.markerClusterGroup({
  maxClusterRadius: 46,
  disableClusteringAtZoom: NZ,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  chunkedLoading: true,
}).addTo(map);
const regionLayer = L.layerGroup().addTo(map);
MARKERS.forEach(makeMarker);

Object.keys(groups).forEach(gName => {
  const gEl = document.createElement("div");
  const h = document.createElement("div"); h.className="group-h"; h.textContent = gName;
  gEl.appendChild(h);
  groups[gName].forEach(cat => {
    catState[cat.id] = true;
    const row = document.createElement("div"); row.className="cat"; row.dataset.cat=cat.id;
    row.innerHTML = `<div class="ic" style="background:${cat.color}">${cat.icon}</div>
      <div class="nm">${cat.name}</div><div class="ct" id="ct-${cat.id}"></div>`;
    row.onclick = () => toggleCat(cat.id);
    gEl.appendChild(row);
  });
  catsEl.appendChild(gEl);
});

/* ---- Sub-filters: korok ground/flight, chest content type ---- */
const subFilters = {
  korok: { field:"kt", state:{ground:true,fly:true}, pills:[["ground","🌿 Ground"],["fly","🍃 Flight"]] },
  chest: { field:"ct", state:{gear:true,gem:true,arrow:true,rupee:true,other:true},
           pills:[["gear","⚔️ Gear"],["gem","💎 Gems"],["arrow","🏹 Arrows"],["rupee","💜 Rupees"],["other","✦ Other"]] },
};
function passSub(r){
  const sf = subFilters[r.cat.id];
  if(!sf) return true;
  const v = r.data[sf.field];
  return v == null || sf.state[v] !== false;
}
Object.keys(subFilters).forEach(catId => {
  const row = document.querySelector(`.cat[data-cat="${catId}"]`);
  if(!row) return;
  const sf = subFilters[catId];
  const sub = document.createElement("div"); sub.className="ksub";
  sub.innerHTML = sf.pills.map(([k,lbl]) => `<span class="kpill on" data-k="${k}">${lbl}</span>`).join("");
  row.after(sub);
  sub.querySelectorAll(".kpill").forEach(p => p.onclick = (e) => {
    e.stopPropagation();
    const k = p.dataset.k; sf.state[k] = !sf.state[k];
    p.classList.toggle("on", sf.state[k]); rebuildCluster();
  });
});

/* ---- Cluster membership = category on (+ not hidden when found) ---- */
const searchEl = document.getElementById("search");
function rebuildCluster(){
  const vis = markerRefs.filter(r => !r.isRegion && catState[r.cat.id]
      && !(hideFound && found[r.data.id])
      && passSub(r)
    ).map(r => r.marker);
  cluster.clearLayers();
  cluster.addLayers(vis);
  rebuildRegions();
  savePrefs();
}
function rebuildRegions(){
  regionLayer.clearLayers();
  if(!catState["region"]) return;
  markerRefs.forEach(r => { if(r.isRegion) regionLayer.addLayer(r.marker); });
}
function updateRegionOpacity(){
  const z = map.getZoom();
  const op = (Math.max(0, Math.min(1, (z - 3.0) / 1.4)) * 0.9).toFixed(2);
  document.getElementById("map").style.setProperty("--rl-op", op);
}
map.on("zoomend", updateRegionOpacity);
updateRegionOpacity();

function toggleCat(id){
  catState[id] = !catState[id];
  document.querySelector(`.cat[data-cat="${id}"]`).classList.toggle("off", !catState[id]);
  rebuildCluster();
}
function refreshCounts(){
  CATEGORIES.forEach(cat => {
    const inCat = MARKERS.filter(m => m.cat===cat.id);
    const total = inCat.length, done = inCat.filter(m => found[m.id]).length;
    const el = document.getElementById("ct-"+cat.id);
    if(el) el.innerHTML = total ? `<b>${done}</b>/${total}` : "";
    const row = document.querySelector(`.cat[data-cat="${cat.id}"]`);
    if(row) row.style.display = total ? "" : "none";
  });
  const coll = MARKERS.filter(m => m.cat!=='region');
  const t = coll.length, d = coll.filter(m => found[m.id]).length, p = t ? Math.round(d/t*100) : 0;
  document.getElementById("dashFill").style.width = p + "%";
  document.getElementById("dashPct").textContent = p + "%";
  document.getElementById("dashSub").textContent = `${d} / ${t} found`;
  updateRegionCounts();
}

/* ---- Region completion (each marker assigned to its nearest Sheikah Tower region) ---- */
const REGION_LIST = [...new Set(MARKERS.map(m => m.region).filter(Boolean))].sort();
const regionCenter = {};
markerRefs.forEach(r => { if(r.cat.id==="tower") regionCenter[r.data.region] = r.marker.getLatLng(); });
const cssId = s => s.replace(/[^a-z0-9]/gi,"_");
function buildRegions(){
  const box = document.getElementById("regionsBox");
  if(!box || !REGION_LIST.length) return;
  const head = document.createElement("div"); head.className="reg-h";
  head.innerHTML = `<span><span class="chev">▶</span> Region completion</span>`;
  const list = document.createElement("div"); list.className="reg-list";
  REGION_LIST.forEach(rg => {
    const row = document.createElement("div"); row.className="reg-row"; row.dataset.region=rg;
    row.innerHTML = `<div class="reg-top"><span>${esc(rg)}</span><b id="rg-${cssId(rg)}">0/0</b></div><div class="reg-bar"><div id="rgbar-${cssId(rg)}"></div></div>`;
    row.onclick = () => { const c = regionCenter[rg]; if(c) map.flyTo(c, 4.5, {duration:.7}); };
    list.appendChild(row);
  });
  head.onclick = () => { head.classList.toggle("open"); list.classList.toggle("open"); };
  box.appendChild(head); box.appendChild(list);
}
function updateRegionCounts(){
  REGION_LIST.forEach(rg => {
    const inR = MARKERS.filter(m => m.region===rg && m.cat!=='region');
    const tot = inR.length, dn = inR.filter(m => found[m.id]).length, p = tot ? Math.round(dn/tot*100) : 0;
    const b = document.getElementById("rg-"+cssId(rg)); if(b) b.textContent = `${dn}/${tot}`;
    const bar = document.getElementById("rgbar-"+cssId(rg)); if(bar) bar.style.width = p+"%";
  });
}

/* ---- Controls ---- */
function setAll(on){
  CATEGORIES.forEach(c => {
    catState[c.id] = on;
    document.querySelector(`.cat[data-cat="${c.id}"]`).classList.toggle("off", !on);
  });
  rebuildCluster();
}
document.getElementById("allOn").onclick  = () => setAll(true);
document.getElementById("allOff").onclick = () => setAll(false);
document.getElementById("reset").onclick = () => {
  if(!confirm("Clear all 'found' progress?")) return;
  const snap = {...found};
  found = {}; saveFound();
  markerRefs.forEach(r => { if(!r.isRegion) r.marker.setIcon(iconFor(r.data, r.cat)); });
  refreshCounts(); rebuildCluster();
  showToast("All progress cleared", () => restoreFound(snap));
};
document.getElementById("sbToggle").onclick = () => document.getElementById("app").classList.toggle("sb-collapsed");
if (window.matchMedia("(max-width:640px)").matches) document.getElementById("app").classList.add("sb-collapsed");

document.getElementById("hideFound").onclick = (e) => {
  hideFound = !hideFound;
  e.currentTarget.classList.toggle("active", hideFound);
  rebuildCluster();
};

/* ---- Bulk mark + undo toast ---- */
const toastEl = document.getElementById("toast");
let toastTimer = null;
function showToast(msg, undoFn){
  toastEl.innerHTML = `<span>${esc(msg)}</span>` + (undoFn ? `<span class="undo">Undo</span>` : "");
  if(undoFn){ toastEl.querySelector(".undo").onclick = () => { undoFn(); toastEl.classList.remove("show"); }; }
  toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 6000);
}
function restoreFound(snap){
  found = snap; saveFound();
  markerRefs.forEach(r => { if(!r.isRegion) r.marker.setIcon(iconFor(r.data, r.cat)); });
  refreshCounts(); rebuildCluster();
}
function bulkMark(val){
  const refs = markerRefs.filter(r => !r.isRegion && catState[r.cat.id] && passSub(r));
  const snap = {...found};
  refs.forEach(r => { if(val) found[r.data.id]=1; else delete found[r.data.id]; r.marker.setIcon(iconFor(r.data, r.cat)); });
  saveFound(); refreshCounts(); rebuildCluster();
  showToast(`${refs.length} markers ${val ? "marked found" : "cleared"}`, () => restoreFound(snap));
}
document.getElementById("markVis").onclick = () => bulkMark(true);
document.getElementById("clearVis").onclick = () => bulkMark(false);

/* ---- Backup & sharing ---- */
document.getElementById("exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ found, notes })], { type:"application/json" }));
  a.download = "botw-map-progress.json"; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = (e) => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      if(data && typeof data === "object"){
        const f = (data.found && typeof data.found === "object") ? data.found : data;   // back-compat: flat found map
        const n = (data.notes && typeof data.notes === "object") ? data.notes : {};
        Object.keys(f).forEach(k => found[k] = f[k]);
        Object.keys(n).forEach(k => notes[k] = n[k]);
        saveFound(); saveNotes();
        markerRefs.forEach(r => { if(!r.isRegion) r.marker.setIcon(iconFor(r.data, r.cat)); });
        refreshCounts(); rebuildCluster();
        alert("Imported — " + Object.keys(found).length + " found, " + Object.keys(notes).length + " notes.");
      }
    }catch(err){ alert("Couldn't read that file."); }
    e.target.value = "";
  };
  rd.readAsText(f);
};
document.getElementById("shareBtn").onclick = async () => {
  const [px,py] = fromLatLng(map.getCenter());
  location.hash = `${px}/${py}/${map.getZoom().toFixed(2)}`;
  const btn = document.getElementById("shareBtn");
  try{ await navigator.clipboard.writeText(location.href); btn.textContent = "Copied!"; }
  catch(e){ btn.textContent = "In URL"; }
  setTimeout(() => btn.textContent = "Share view", 1400);
};

/* ---- Search ---- */
const resultsEl = document.getElementById("results");
function renderResults(){
  const q = searchEl.value.trim().toLowerCase();
  if(!q){ resultsEl.style.display="none"; resultsEl.innerHTML=""; return; }
  const matches = markerRefs.filter(r => r.data.name.toLowerCase().includes(q) ||
    (r.data.desc||"").toLowerCase().includes(q)).slice(0,18);
  resultsEl.style.display="block";
  if(!matches.length){ resultsEl.innerHTML='<div class="res-empty">No matches</div>'; return; }
  resultsEl.innerHTML="";
  matches.forEach(r => {
    const item = document.createElement("div"); item.className="res";
    item.innerHTML = `<span class="res-ic" style="background:${r.cat.color}">${r.cat.icon}</span>`+
      `<span class="res-nm">${r.data.name}</span><span class="res-cat">${r.cat.name}</span>`;
    item.onmousedown = (e) => {
      e.preventDefault();
      if(!catState[r.cat.id]){ catState[r.cat.id]=true; document.querySelector(`.cat[data-cat="${r.cat.id}"]`).classList.remove("off"); rebuildCluster(); }
      resultsEl.style.display="none"; searchEl.value=r.data.name;
      if(r.isRegion){ map.flyTo(r.marker.getLatLng(), Math.max(map.getZoom(), 5), {duration:.6}); }
      else { cluster.zoomToShowLayer(r.marker, () => r.marker.openPopup()); }
    };
    resultsEl.appendChild(item);
  });
}
searchEl.oninput = renderResults;
searchEl.onfocus = renderResults;
searchEl.onblur  = () => setTimeout(() => { resultsEl.style.display="none"; }, 150);

/* ---- Coordinate readout (for placing/checking pins) ---- */
map.on("mousemove", e => {
  const [px,py] = fromLatLng(e.latlng);
  document.getElementById("coord").textContent = `px: ${px}, py: ${py}`;
});
map.on("click", e => {
  const [px,py] = fromLatLng(e.latlng);
  console.log(`world x=${((px-12000)/2).toFixed(1)} z=${((py-10000)/2).toFixed(1)}  (px:${px} py:${py})`);
});

/* ---- Restore saved filters + shared view ---- */
function restoreState(){
  const p = SAVED_PREFS;
  if(p){
    if(p.cats) CATEGORIES.forEach(c => { if(c.id in p.cats){ catState[c.id]=p.cats[c.id]; const row=document.querySelector(`.cat[data-cat="${c.id}"]`); if(row) row.classList.toggle("off", !catState[c.id]); } });
    if(p.hf){ hideFound=true; document.getElementById("hideFound").classList.add("active"); }
  }
  if(location.hash.startsWith("#m=")){
    const id = decodeURIComponent(location.hash.slice(3));
    const ref = markerRefs.find(r => r.data.id===id);
    if(ref){
      if(!ref.isRegion && !catState[ref.cat.id]){ catState[ref.cat.id]=true; const row=document.querySelector(`.cat[data-cat="${ref.cat.id}"]`); if(row) row.classList.remove("off"); rebuildCluster(); }
      setTimeout(() => { if(ref.isRegion) map.flyTo(ref.marker.getLatLng(), 6, {duration:.6}); else cluster.zoomToShowLayer(ref.marker, () => ref.marker.openPopup()); }, 250);
    }
    return;
  }
  const h = location.hash.replace(/^#/,"").split("/");
  if(h.length===3){
    const px=+h[0], py=+h[1], z=+h[2];
    if(isFinite(px)&&isFinite(py)&&isFinite(z)) map.setView(xy(px,py), z, {animate:false});
  }
}

/* ============================================================
   ROUTES / QUESTLINES — ordered numbered pins + dashed path +
   side panel with per-step done state. Currently: Captured Memories.
   ============================================================ */
const QL = window.QUESTLINES || [];
const questState = {}, questLayers = {}, stepMarkers = {};
let panelQuest = null;
const QSAVE_KEY = "botw-map-quests-v1";
let qsave = (function(){ try{ return JSON.parse(localStorage.getItem(QSAVE_KEY)) || {shown:{},done:{}}; }catch(e){ return {shown:{},done:{}}; } })();
qsave.shown = qsave.shown||{}; qsave.done = qsave.done||{};
function saveQuests(){ try{ localStorage.setItem(QSAVE_KEY, JSON.stringify(qsave)); }catch(e){} }
function isDone(id,n){ return !!(qsave.done[id] && qsave.done[id][n]); }
function qProgress(q){ return { t:q.steps.length, d:q.steps.filter(s=>isDone(q.id,s.n)).length }; }
function currentN(q){ const s=q.steps.find(s=>!isDone(q.id,s.n)); return s?s.n:0; }

function qIcon(color,n,st){
  const bg = st.done ? "#39414f" : (st.start ? "#e8943c" : color);
  const sz = st.start ? 26 : 22;
  const cls = ["qpin"]; if(st.start)cls.push("start"); if(st.done)cls.push("done"); if(st.current)cls.push("current");
  return L.divIcon({ html:`<div class="${cls.join(' ')}" style="background:${bg};width:${sz}px;height:${sz}px"><span>${st.done?'✓':n}</span></div>`,
    className:"", iconSize:[sz,sz], iconAnchor:[sz/2,sz-2], popupAnchor:[0,-(sz-4)] });
}
function stepPopup(q,s){
  const done = isDone(q.id,s.n);
  return `<div class="pop-cat" style="color:${q.color}">${esc(q.name)}</div>`+
    `<div class="pop-t">${s.n}. ${esc(s.title)}</div>`+
    (s.desc?`<div class="pop-d">${esc(s.desc)}</div>`:"")+
    `<div class="pop-found ${done?'on':''}" data-qd="${q.id}#${s.n}"><span>${done?'✓':'○'}</span><span>${done?'Step complete':'Mark step done'}</span></div>`;
}
function renderQuest(q){
  if(questLayers[q.id]){ map.removeLayer(questLayers[q.id]); delete questLayers[q.id]; }
  if(!questState[q.id]) return;
  const lg = L.layerGroup();
  if(q.steps.length>1) L.polyline(q.steps.map(s=>xy(s.px,s.py)), {color:q.color,weight:2.5,opacity:.6,dashArray:"5,6"}).addTo(lg);
  const cur = currentN(q);
  q.steps.forEach(s=>{
    const st = { start:s.n===1, done:isDone(q.id,s.n), current:s.n===cur };
    const mk = L.marker(xy(s.px,s.py), {icon:qIcon(q.color,s.n,st), title:`${s.n}. ${s.title}`, zIndexOffset: st.current?3000:(st.start?2000:1000)});
    mk.bindPopup(()=>stepPopup(q,s), {minWidth:230});
    mk.on("popupopen", ()=>bindStepPopup(q,s,mk));
    mk.addTo(lg); stepMarkers[q.id+'#'+s.n]=mk;
  });
  lg.addTo(map); questLayers[q.id]=lg;
}
function bindStepPopup(q,s,mk){
  const el = document.querySelector(`.pop-found[data-qd="${q.id}#${s.n}"]`);
  if(el) el.onclick = () => { toggleStepDone(q,s.n); mk.setPopupContent(stepPopup(q,s)); bindStepPopup(q,s,mk); };
}
function toggleStepDone(q,n){
  if(isDone(q.id,n)) delete qsave.done[q.id][n]; else (qsave.done[q.id] ||= {})[n]=1;
  saveQuests(); renderQuest(q); updateQuestRow(q);
  if(panelQuest && panelQuest.id===q.id) fillPanel(q);
}
function renderActiveQuests(){ QL.forEach(q=>{ if(questState[q.id]) renderQuest(q); }); }

const qPanel = document.getElementById("questPanel");
function openQuestPanel(q){
  panelQuest = q;
  if(!questState[q.id]){ questState[q.id]=true; qsave.shown[q.id]=1; saveQuests(); renderQuest(q); }
  updateQuestRow(q); fillPanel(q); qPanel.classList.add("open");
  if(window.matchMedia("(max-width:640px)").matches) document.getElementById("app").classList.add("sb-collapsed");
}
function closeQuestPanel(){ qPanel.classList.remove("open"); panelQuest=null; }
function fillPanel(q){
  const {t,d} = qProgress(q), pct = t?Math.round(d/t*100):0, cur = currentN(q);
  const rows = q.steps.map(s=>{
    const done = isDone(q.id,s.n), isCur = s.n===cur;
    return `<div class="qs-row ${done?'done':''} ${isCur?'cur':''}" data-n="${s.n}">`+
      `<div class="qs-chk ${done?'on':''}" data-chk="${s.n}">${done?'✓':''}</div>`+
      `<div class="qs-num" style="background:${q.color}">${s.n}</div>`+
      `<div class="qs-body"><div class="qs-t">${esc(s.title)}</div></div></div>`;
  }).join("");
  qPanel.innerHTML =
    `<div class="qp-head"><div class="qp-title"><span class="qp-dot" style="background:${q.color}"></span>${esc(q.name)}</div><div class="qp-x" id="qpX">✕</div></div>`+
    `<div class="qp-prog"><div class="qp-prog-top"><span>${d} / ${t} done</span><b>${pct}%</b></div><div class="dash-bar"><div style="width:${pct}%"></div></div></div>`+
    `<div class="qp-steps">${rows}</div>`;
  document.getElementById("qpX").onclick = closeQuestPanel;
  qPanel.querySelectorAll(".qs-row").forEach(row=>{
    const n = +row.dataset.n, s = q.steps.find(x=>x.n===n);
    row.querySelector(".qs-chk").onclick = (e)=>{ e.stopPropagation(); toggleStepDone(q,n); };
    row.onclick = ()=>flyToStep(q,s);
  });
}
function flyToStep(q,s){
  if(!questState[q.id]){ questState[q.id]=true; renderQuest(q); }
  map.flyTo(xy(s.px,s.py), Math.max(map.getZoom(), 6), {duration:.6});
  const mk = stepMarkers[q.id+'#'+s.n];
  if(mk) setTimeout(()=>mk.openPopup(),380);
  fillPanel(q);
}
function updateQuestRow(q){
  const row = document.querySelector(`.quest-row[data-q="${q.id}"]`);
  if(!row) return;
  row.classList.toggle("off", !questState[q.id]);
  const {t,d} = qProgress(q);
  const ct = row.querySelector(".ct"); if(ct) ct.innerHTML = d?`<b>${d}</b>/${t}`:`${t}`;
}
function toggleQuest(id){
  const q = QL.find(x=>x.id===id);
  if(questState[id] && !(panelQuest && panelQuest.id===id)){ openQuestPanel(q); return; }
  questState[id] = !questState[id];
  if(questState[id]) qsave.shown[id]=1; else delete qsave.shown[id];
  saveQuests(); updateQuestRow(q); renderQuest(q);
  if(questState[id]) openQuestPanel(q); else if(panelQuest && panelQuest.id===id) closeQuestPanel();
}
if(QL.length){
  const gEl = document.createElement("div");
  const h = document.createElement("div"); h.className="group-h"; h.textContent="Routes"; gEl.appendChild(h);
  QL.forEach(q=>{
    questState[q.id] = false;
    const row = document.createElement("div"); row.className="cat quest-row off"; row.dataset.q=q.id;
    row.innerHTML = `<div class="dot" style="background:${q.color}"></div><div class="nm">${esc(q.name)}</div><div class="ct">${q.steps.length}</div>`;
    row.onclick = ()=>toggleQuest(q.id);
    gEl.appendChild(row);
  });
  catsEl.appendChild(gEl);
  QL.forEach(q=>{ if(qsave.shown[q.id]) questState[q.id]=true; updateQuestRow(q); });
  renderActiveQuests();
}

buildRegions();
refreshCounts();
rebuildCluster();
restoreState();
</script>
</body>
</html>
